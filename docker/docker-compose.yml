services:
  # Vyapari Nestam WhatsApp app
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vyapari-nestam-whatsapp:local
    container_name: vyapari_nestam_whatsapp_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:8080"
    networks:
      - vyapari_nestam_whatsapp
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads:rw
      - ./config.toml:/app/config.toml:ro
    command: ["server", "-migrate", "-config", "/app/config.toml"]

  # PostgreSQL database
  db:
    image: postgres:17-alpine
    container_name: vyapari_nestam_whatsapp_db
    restart: unless-stopped
    networks:
      - vyapari_nestam_whatsapp
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vyapari_nestam_whatsapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vyapari_nestam_whatsapp}
      POSTGRES_DB: ${POSTGRES_DB:-vyapari_nestam_whatsapp}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vyapari_nestam_whatsapp} -d ${POSTGRES_DB:-vyapari_nestam_whatsapp}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - vyapari-nestam-whatsapp-postgres-data:/var/lib/postgresql/data

  # Redis
  redis:
    image: redis:7-alpine
    container_name: vyapari_nestam_whatsapp_redis
    restart: unless-stopped
    networks:
      - vyapari_nestam_whatsapp
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - vyapari-nestam-whatsapp-redis-data:/data

networks:
  vyapari_nestam_whatsapp:

volumes:
  vyapari-nestam-whatsapp-postgres-data:
  vyapari-nestam-whatsapp-redis-data:
